version: '3.8'

services:
  mysql_db:
    image: mysql:8.0
    container_name: simpro_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: simpro_db
      MYSQL_USER: simpro_user
      MYSQL_PASSWORD: simpro_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  mysql_data: